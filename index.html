<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="Permissions-Policy" content="camera=*">
    <meta name="description" content="AR Plant Doctor — Point your camera at a plant marker to see real-time care status.">
    <title>AR Plant Doctor — Scanner</title>

    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- AR Status Banner -->
    <div id="ar-status-bar">
        <span class="status-dot" id="status-dot"></span>
        <span id="ar-status-text">Scanning — point at a plant marker</span>
    </div>

    <!-- Loading Screen -->
    <div id="loading-screen">
        <div class="loading-ring"></div>
        <div class="loading-logo">🌿 AR Plant Doctor</div>
        <div class="loading-sub">Starting camera…</div>
    </div>

    <!--
        smooth:true          — enables pose smoothing
        smoothCount:10       — samples over 10 frames
        smoothTolerance:0.01 — ignores sub-pixel jitter
        smoothThreshold:2    — minimum movement threshold
    -->
    <a-scene
        embedded
        arjs="sourceType: webcam;
              debugUIEnabled: false;
              patternRatio: 0.75;
              smooth: true;
              smoothCount: 10;
              smoothTolerance: 0.01;
              smoothThreshold: 2;">

        <a-entity camera></a-entity>
    </a-scene>

    <!-- Bottom Bar -->
    <div class="bottom-bar">
        <span class="brand-label">AR Plant Doctor</span>
        <a href="/dashboard/" class="dash-btn">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                <polyline points="9 22 9 12 15 12 15 22"/>
            </svg>
            Dashboard
        </a>
    </div>

    <script src="app.js"></script>
</body>
</html>
