<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <!-- Meta tag / permission policy for camera access -->
    <meta http-equiv="Permissions-Policy" content="camera=*">
    <title>AR Plant Doctor</title>
    
    <!-- A-Frame 1.4.0 CDN -->
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    
    <!-- AR.js for A-Frame CDN -->
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="loading-screen">
        <span class="leaf-icon">🌿</span>
        <p>Point camera at a plant QR code</p>
    </div>

    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3;">
        <!-- AR Barcode Markers 1 through 5 -->
        <a-marker type="barcode" value="1" id="marker-1">
            <a-plane position="0 1.8 0" width="2.2" height="1.6" color="#1A1A2E" opacity="0.88"></a-plane>
            <a-text id="emoji-1" position="-0.9 2.3 0.05" value="🪴" color="#52B788" width="5"></a-text>
            <a-text id="name-1" position="-0.6 2.3 0.05" value="Loading..." color="white" width="4"></a-text>
            <a-text id="water-1" position="-0.9 2.0 0.05" value="Water status" color="#FFD166" width="3.5"></a-text>
            <a-text id="sun-1" position="-0.9 1.7 0.05" value="Sunlight" color="#B7E4C7" width="3.2"></a-text>
            <a-text id="tip-1" position="-0.9 1.4 0.05" value="Tip" color="#B7E4C7" width="2.8"></a-text>
        </a-marker>

        <a-marker type="barcode" value="2" id="marker-2">
            <a-plane position="0 1.8 0" width="2.2" height="1.6" color="#1A1A2E" opacity="0.88"></a-plane>
            <a-text id="emoji-2" position="-0.9 2.3 0.05" value="🪴" color="#52B788" width="5"></a-text>
            <a-text id="name-2" position="-0.6 2.3 0.05" value="Loading..." color="white" width="4"></a-text>
            <a-text id="water-2" position="-0.9 2.0 0.05" value="Water status" color="#FFD166" width="3.5"></a-text>
            <a-text id="sun-2" position="-0.9 1.7 0.05" value="Sunlight" color="#B7E4C7" width="3.2"></a-text>
            <a-text id="tip-2" position="-0.9 1.4 0.05" value="Tip" color="#B7E4C7" width="2.8"></a-text>
        </a-marker>

        <a-marker type="barcode" value="3" id="marker-3">
            <a-plane position="0 1.8 0" width="2.2" height="1.6" color="#1A1A2E" opacity="0.88"></a-plane>
            <a-text id="emoji-3" position="-0.9 2.3 0.05" value="🪴" color="#52B788" width="5"></a-text>
            <a-text id="name-3" position="-0.6 2.3 0.05" value="Loading..." color="white" width="4"></a-text>
            <a-text id="water-3" position="-0.9 2.0 0.05" value="Water status" color="#FFD166" width="3.5"></a-text>
            <a-text id="sun-3" position="-0.9 1.7 0.05" value="Sunlight" color="#B7E4C7" width="3.2"></a-text>
            <a-text id="tip-3" position="-0.9 1.4 0.05" value="Tip" color="#B7E4C7" width="2.8"></a-text>
        </a-marker>

        <a-marker type="barcode" value="4" id="marker-4">
            <a-plane position="0 1.8 0" width="2.2" height="1.6" color="#1A1A2E" opacity="0.88"></a-plane>
            <a-text id="emoji-4" position="-0.9 2.3 0.05" value="🪴" color="#52B788" width="5"></a-text>
            <a-text id="name-4" position="-0.6 2.3 0.05" value="Loading..." color="white" width="4"></a-text>
            <a-text id="water-4" position="-0.9 2.0 0.05" value="Water status" color="#FFD166" width="3.5"></a-text>
            <a-text id="sun-4" position="-0.9 1.7 0.05" value="Sunlight" color="#B7E4C7" width="3.2"></a-text>
            <a-text id="tip-4" position="-0.9 1.4 0.05" value="Tip" color="#B7E4C7" width="2.8"></a-text>
        </a-marker>

        <a-marker type="barcode" value="5" id="marker-5">
            <a-plane position="0 1.8 0" width="2.2" height="1.6" color="#1A1A2E" opacity="0.88"></a-plane>
            <a-text id="emoji-5" position="-0.9 2.3 0.05" value="🪴" color="#52B788" width="5"></a-text>
            <a-text id="name-5" position="-0.6 2.3 0.05" value="Loading..." color="white" width="4"></a-text>
            <a-text id="water-5" position="-0.9 2.0 0.05" value="Water status" color="#FFD166" width="3.5"></a-text>
            <a-text id="sun-5" position="-0.9 1.7 0.05" value="Sunlight" color="#B7E4C7" width="3.2"></a-text>
            <a-text id="tip-5" position="-0.9 1.4 0.05" value="Tip" color="#B7E4C7" width="2.8"></a-text>
        </a-marker>

        <!-- Camera Entity -->
        <a-entity camera></a-entity>
    </a-scene>

    <script src="app.js"></script>
</body>
</html>
