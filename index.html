<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <!-- Meta tag / permission policy for camera access -->
    <meta http-equiv="Permissions-Policy" content="camera=*">
    <title>AR Plant Doctor</title>
    
    <!-- A-Frame 1.4.0 CDN -->
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    
    <!-- AR.js for A-Frame CDN (Master Build) -->
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Live 2D HTML Status Banner -->
    <div id="ar-overlay-info">🌿 AR Doctor Active: Scan a plant marker</div>

    <div class="loading-screen">
        <p>Scan a plant marker</p>
    </div>

    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false; patternRatio: 0.75;">
        <a-marker type="pattern" url="/markers/marker-1.patt" id="marker-1" patternRatio="0.75">
            <!-- Main card background -->
            <a-plane position="0 1.8 0" width="2.2" height="1.6" color="#0a1a0d" opacity="0.94" side="double"></a-plane>

            <!-- Header entity: geometry + text combined — text auto-fits geometry width -->
            <a-entity
              position="0 2.52 0.01"
              geometry="primitive: plane; width: 2.2; height: 0.32"
              material="color: #162318; opacity: 0.0; transparent: true"
              text="value: Loading...; color: #e8f0e9; wrapCount: 22; width: 2.0; anchor: center; align: center; baseline: center; font: roboto"
              id="name-1">
            </a-entity>

            <!-- Divider -->
            <a-plane position="0 2.35 0.01" width="2.0" height="0.01" color="#2a3d2e" opacity="1"></a-plane>

            <!-- Water row entity -->
            <a-entity
              position="-0.9 2.18 0.01"
              text="value: 💧 Water status; color: #d4a843; wrapCount: 28; width: 1.9; anchor: left; align: left; baseline: center; font: roboto"
              id="water-1">
            </a-entity>

            <!-- Divider -->
            <a-plane position="0 2.0 0.01" width="2.0" height="0.01" color="#2a3d2e" opacity="1"></a-plane>

            <!-- Sun row entity -->
            <a-entity
              position="-0.9 1.82 0.01"
              text="value: ☀ Sunlight; color: #6b8f6e; wrapCount: 28; width: 1.9; anchor: left; align: left; baseline: center; font: roboto"
              id="sun-1">
            </a-entity>

            <!-- Divider -->
            <a-plane position="0 1.65 0.01" width="2.0" height="0.01" color="#2a3d2e" opacity="1"></a-plane>

            <!-- Tip row entity -->
            <a-entity
              position="-0.9 1.42 0.01"
              text="value: 💡 Tip; color: #4a6b4e; wrapCount: 22; width: 1.9; anchor: left; align: left; baseline: center; font: roboto"
              id="tip-1">
            </a-entity>

            <!-- Emoji top left of card -->
            <a-text id="emoji-1" value="🌿" position="-0.75 2.52 0.02" width="0.8" color="#7ec897"></a-text>
        </a-marker>
